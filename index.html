<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FFRPG2 Fichas</title>
    <meta name="description" content="Perfis de personagens e fichas de FFRPG2.">
    <link rel="stylesheet" href="assets/site.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Lista de fichas">
        <header class="sidebar-header">
          <p class="eyebrow">FFRPG2</p>
          <h1>Fichas</h1>
        </header>

        <label class="search-box">
          <span>Buscar</span>
          <input id="profile-search" type="search" placeholder="Nome, classe, raça..." autocomplete="off">
        </label>

        <nav id="profile-list" class="profile-list" aria-label="Personagens"></nav>
      </aside>

      <main class="profile-view">
        <section id="profile-hero" class="profile-hero" aria-live="polite">
          <div class="hero-copy">
            <p id="profile-type" class="eyebrow">Carregando</p>
            <h2 id="profile-name">FFRPG2</h2>
            <dl id="profile-stats" class="quick-stats"></dl>
          </div>
          <div class="portrait-frame">
            <img id="profile-image" alt="" hidden>
            <div id="profile-initials" class="portrait-fallback">F2</div>
          </div>
        </section>

        <section class="content-layout">
          <aside id="profile-toc" class="toc" aria-label="Seções"></aside>
          <article id="profile-content" class="sheet-content"></article>
        </section>
      </main>
    </div>

    <script src="assets/site.js"></script>
  </body>
</html>
